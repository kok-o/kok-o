<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 110" width="100%" height="110">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="854" height="110" rx="10" fill="url(#bg)" stroke="#30363d" stroke-width="1" />
  <rect width="854" height="110" rx="10" fill="url(#dots)" />
  <rect x="0" y="0" width="854" height="3" rx="1.5" fill="url(#accent)" />

  <g text-anchor="middle">
    <text x="427" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      Software Engineer
    </text>
    <text x="427" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="500" fill="#8b949e" letter-spacing="0.5">
      AI &amp; Developer Tools
    </text>
  </g>
</svg>
