<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#79c0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6edf3" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#ffffff" fill-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="180" rx="12" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle Dot Grid Pattern -->
  <rect width="900" height="180" rx="12" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="900" height="3" rx="1.5" fill="url(#accentGlow)" />

  <!-- Content -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="450" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="40" font-weight="700" fill="url(#textGradient)" letter-spacing="1">
      Nurkhan Esenbek
    </text>

    <!-- Subtitle -->
    <text x="450" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16" font-weight="500" fill="#8b949e" letter-spacing="0.5">
      Software Developer &bull; Full-Stack &amp; AI Tooling &bull; Open Source
    </text>

    <!-- Subtle Location / Focus Tag -->
    <g transform="translate(370, 134)">
      <rect x="0" y="0" width="160" height="24" rx="12" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="15" cy="12" r="3.5" fill="#3fb950" />
      <text x="88" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#c9d1d9" text-anchor="middle">
        Astana, Kazakhstan
      </text>
    </g>
  </g>
</svg>
